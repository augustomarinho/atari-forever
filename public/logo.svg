<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Atari Forever logo">
  <title>Atari Forever</title>
  <rect width="256" height="256" rx="40" fill="#15110f"/>
  <!-- joystick ball -->
  <g fill="#e8452c">
    <rect x="96" y="16" width="64" height="16"/>
    <rect x="80" y="32" width="96" height="32"/>
    <rect x="96" y="64" width="64" height="16"/>
  </g>
  <rect x="96" y="32" width="16" height="16" fill="#ff8a6b"/>
  <rect x="144" y="48" width="16" height="16" fill="#b82d18"/>
  <!-- shaft -->
  <rect x="112" y="80" width="32" height="64" fill="#c9c9c9"/>
  <rect x="112" y="80" width="12" height="64" fill="#efefef"/>
  <!-- base -->
  <rect x="48" y="144" width="160" height="16" fill="#5a5a5a"/>
  <rect x="32" y="160" width="192" height="48" fill="#2b2b2b"/>
  <rect x="32" y="160" width="192" height="8" fill="#3d3d3d"/>
  <!-- fire button -->
  <rect x="176" y="168" width="32" height="24" fill="#f7a21b"/>
  <rect x="176" y="168" width="32" height="8" fill="#ffc85a"/>
  <!-- retro stripes -->
  <rect x="32" y="216" width="48" height="12" fill="#f7a21b"/>
  <rect x="80" y="216" width="48" height="12" fill="#e8452c"/>
  <rect x="128" y="216" width="48" height="12" fill="#b7348b"/>
  <rect x="176" y="216" width="48" height="12" fill="#2f6fd1"/>
</svg>
